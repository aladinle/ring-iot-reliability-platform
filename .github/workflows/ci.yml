name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpp:
    name: C++ Build And Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S device_simulator -B device_simulator/build

      - name: Build
        run: cmake --build device_simulator/build --config Debug

      - name: Test
        run: ctest --test-dir device_simulator/build -C Debug --output-on-failure

  backend:
    name: Backend Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend and dashboard tests
        run: python -m pytest tests/backend tests/dashboard

  deploy-placeholder:
    name: Deploy Placeholder
    runs-on: windows-latest
    needs:
      - cpp
      - backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployment target not configured
        run: echo "Tests passed. Add real deployment steps here when a target environment exists."
